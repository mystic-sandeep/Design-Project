# ========================= SERVER CONFIGURATION =========================
server.port=8080

# ========================= DATABASE CONFIGURATION =========================
# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mygate_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Use environment variables for credentials. If not set, it will try to use 'root' as a fallback.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ========================= JWT CONFIGURATION =========================
jwt.secret=mygate_2026_secure_key_layer1_jwt_authentication_system_very_long_string_to_make_it_secure_enough_for_hs512_algorithm_change_this_in_production
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# ========================= ENCRYPTION CONFIGURATION =========================
encryption.key=mygate2026encryptionkey1234567890abcdef
encryption.algorithm=AES

# ========================= SECURITY CONFIGURATION =========================
bcrypt.rounds=12
login.max.attempts=5
login.lockout.duration=900000

# ========================= LOGGING =========================
logging.level.root=INFO
logging.level.com.mygate=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================= H2 CONSOLE (Optional - for development) =========================
# Uncomment if you want to use H2 console for debugging
# spring.h2.console.enabled=false

# ========================= JACKSON CONFIGURATION =========================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC