buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Define the file path correctly outside the blocks
def storageRepoPath = "${rootProject.projectDir}/../node_modules/@react-native-async-storage/async-storage/android/local_repo"
def storageRepoFile = file(storageRepoPath)

allprojects {
    repositories {
        google()
        mavenCentral()

        // Point Gradle to look locally inside node_modules safely
        if (storageRepoFile.exists()) {
            maven {
                url storageRepoFile
            }
        }
    }
}